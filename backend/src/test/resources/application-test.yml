spring:
  datasource:
    url: jdbc:h2:mem:fastfood;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: integration-test-secret-key-with-at-least-32-characters
    expiration-ms: 3600000
  seed:
    enabled: true

logging:
  level:
    root: WARN
    com.fastfood: INFO