server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: fastfood-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fastfood}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: fastfood-pool

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # 256-bit (or longer) secret for HS256. Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:fastfood-super-secret-key-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443,http://127.0.0.1:8443,http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${SEED_DATA:true}

logging:
  level:
    root: INFO
    com.fastfood: INFO
    org.springframework.security: WARN