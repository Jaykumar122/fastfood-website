<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ff-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b42" />
      <stop offset="100%" stop-color="#ea4c16" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="url(#ff-grad)" />
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />
  <!-- Shadow for depth -->
  <polygon
    points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
    fill="#b9340e"
    opacity="0.35"
    transform="translate(14, 15.5) scale(1.5)"
  />
  <!-- Signature Zap Icon -->
  <polygon
    points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
    fill="#ffffff"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linejoin="round"
    transform="translate(14, 14) scale(1.5)"
  />
